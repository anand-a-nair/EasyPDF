# PDFium vendoring manifest — the pinned record required by TD-007.
#
# Every field here is load-bearing. This file is the entire provenance record
# for the project's most security-sensitive dependency, and scripts/fetch-pdfium.sh
# refuses to install anything whose hash does not match.
#
# NEVER change a hash without changing the release tag, and never point this at
# "latest". A moving dependency is not a pinned one.

release_tag = "chromium/8009"
pdfium_version = "153.0.8009.0"
source = "https://github.com/bblanchon/pdfium-binaries"
url_template = "https://github.com/bblanchon/pdfium-binaries/releases/download/{tag}/pdfium-{target}.tgz"
retrieved = "2026-08-24"

# Build flags verified from args.gn inside the archive, not assumed from docs:
#
#   pdf_enable_v8  = false   <- no JavaScript engine is present at all
#   pdf_enable_xfa = false   <- XFA forms unsupported, matching our decision
#                               to detect and refuse rather than half-support
#
# The V8 flag matters more than it looks. The security model in
# ideas/07-security.md states that PDF JavaScript is never executed with no
# setting to enable it. With this build that is enforced *structurally* — the
# engine is not in the binary — rather than by a policy someone could later
# flip. The V8-enabled variants of this same release exist and are 3.7x larger;
# they must never be used.
#
# The library does export FPDFDoc_GetJavaScriptAction and friends, which only
# *read* JavaScript embedded in a document. Those are safe and potentially
# useful: they let us warn a user that a document contains scripts without ever
# running them.

# Licensing: PDFium itself is BSD-3-Clause (Google). The packaging around it is
# MIT (Benoit Blanchon). Both are compatible with Apache-2.0 distribution and
# both require attribution — see NOTICE.

[targets]
mac-arm64  = "b1f2f17c7432a9942514dda5094ee9822c743bdfd07e7187725efbd34fde941f"
mac-x64    = "e0afb6905e97438a9159aaa5b6c4fe188d97a7e3be05dc4782422c3ca7e1ce1a"
linux-x64  = "be513e8021a5bf8eb2116e00d78c3bacb82c5a02b3785156ae14fe5e33084385"
win-x64    = "c78a8cd51b48abafcb266d868e401afefda1d189aa01ebbe743dc1d144e06031"
