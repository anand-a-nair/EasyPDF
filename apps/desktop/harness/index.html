<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EasyPDF frontend harness</title>
    <link rel="stylesheet" href="../dist/styles.css" />
    <!--
      Exercises the real frontend bundle in a plain browser with Tauri stubbed
      out. Development tool, never shipped — it lives outside dist/ so it
      cannot end up in a build.

      The markup mirrors the app's. `scripts/check-contracts.mjs` keeps the
      stubs in stubs.js honest against the real Rust payloads.

      Run:  python3 -m http.server 8731 --directory apps/desktop
      Open: http://localhost:8731/harness/
    -->
    <script type="module">
      import { createState, createInternals } from "./stubs.js";

      window.__harness = createState();
      window.addEventListener("error", (e) => window.__harness.errors.push(String(e.message)));
      window.__TAURI_INTERNALS__ = createInternals(window.__harness);
    </script>
  </head>
  <body>
    <header id="toolbar">
      <button id="open" type="button" class="primary">Open…</button>

      <div class="group" data-requires-document id="panel-buttons"></div>

      <div class="group" data-requires-document>
        <button id="prev" type="button" title="Previous page">‹</button>
        <span id="page-indicator">— / —</span>
        <button id="next" type="button" title="Next page">›</button>
      </div>

      <div class="group" data-requires-document>
        <button id="zoom-out" type="button" title="Zoom out">−</button>
        <span id="zoom-indicator">100%</span>
        <button id="zoom-in" type="button" title="Zoom in">+</button>
        <button id="zoom-fit" type="button" title="Fit whole page">Fit</button>
        <button id="zoom-fit-width" type="button" title="Fit page width">Width</button>
      </div>

      <div class="group" data-requires-document>
        <button id="rotate-left" type="button" title="Rotate left">↺</button>
        <button id="rotate-right" type="button" title="Rotate right">↻</button>
      </div>

      <div class="group" data-requires-document>
        <button id="view-page" type="button" class="active" title="One page at a time">Page</button>
        <button id="view-scroll" type="button" title="Continuous scrolling">Scroll</button>
      </div>

      <div class="group" data-requires-document>
        <input id="search-input" type="search" placeholder="Find in document" />
        <button id="search-prev" type="button" title="Previous match">‹</button>
        <span id="search-count"></span>
        <button id="search-next" type="button" title="Next match">›</button>
      </div>

      <span id="doc-name"></span>
      <span id="sandbox-badge" title="Worker status"></span>
    </header>

    <div id="workspace">
      <aside id="sidebar" hidden></aside>

      <main id="viewport">
        <div id="empty-state">
          <h1>EasyPDF</h1>
          <p>Open a PDF to get started. Nothing leaves this machine.</p>
          <button id="open-empty" type="button" class="primary">Open a PDF…</button>
        </div>
        <div id="pages" hidden></div>
      </main>
    </div>

    <div id="error" role="alert" hidden></div>

    <dialog id="password-dialog">
      <h2>Password required</h2>
      <p id="password-message">This document is password protected.</p>
      <input id="password-input" type="password" autocomplete="off"
             placeholder="Document password" />
      <div class="dialog-actions">
        <button id="password-cancel" type="button">Cancel</button>
        <button id="password-submit" type="button" class="primary">Open</button>
      </div>
    </dialog>

    <script type="module" src="../dist/main.js"></script>
  </body>
</html>
