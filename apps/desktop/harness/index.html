<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EasyPDF frontend harness</title>
    <!--
      Exercises the real frontend bundle in a plain browser with Tauri stubbed
      out. Development tool, never shipped — it lives outside dist/ so it
      cannot end up in a build.

      This exists because the frontend once shipped completely broken: tsc
      emitted bare module specifiers ("@tauri-apps/api/core") that no webview
      can resolve, so the script failed to load and nothing worked at all. No
      Rust test could have caught it. Loading the real bundle here does.

      Run:  python3 -m http.server 8731 --directory apps/desktop
      Open: http://localhost:8731/harness/
    -->
    <link rel="stylesheet" href="../dist/styles.css" />
    <script>
      // Stands in for Tauri so the real frontend bundle can be exercised in a
      // plain browser. Development harness only — never shipped.
      // Set window.__harness.failCommand = "plugin:dialog|open" to simulate a
      // denied permission. Regression cover for the capability bug: the app
      // once had no capability file at all, so the dialog call rejected and
      // the click did nothing visible whatsoever.
      window.__harness = { calls: [], errors: [], failCommand: null, pageCount: 3,
                           requirePassword: null, outline: [] };
      window.addEventListener("error", (e) => window.__harness.errors.push(String(e.message)));

      function fakePage(width, height) {
        const buffer = new ArrayBuffer(8 + width * height * 4);
        const view = new DataView(buffer);
        view.setUint32(0, width, true);
        view.setUint32(4, height, true);
        const pixels = new Uint8Array(buffer, 8);
        for (let i = 0; i < pixels.length; i += 4) {
          const dark = i % 400 < 40;
          pixels[i] = dark ? 20 : 255;
          pixels[i + 1] = dark ? 20 : 255;
          pixels[i + 2] = dark ? 20 : 255;
          pixels[i + 3] = 255;
        }
        return buffer;
      }

      window.__TAURI_INTERNALS__ = {
        transformCallback: (cb) => cb,
        unregisterCallback: () => {},
        invoke: async (cmd, args) => {
          window.__harness.calls.push({ cmd, args });
          if (window.__harness.failCommand === cmd) {
            throw new Error(`${cmd} not allowed. Permissions associated with this command: ...`);
          }
          switch (cmd) {
            case "worker_status":
              return { running: true, sandboxed: true, detail: "confined via seatbelt", memoryCapped: false };
            case "plugin:dialog|open":
              return "/fake/example.pdf";
            case "outline":
              return window.__harness.outline;
            case "open_document":
              // Simulates an encrypted document: rejects until the right
              // password arrives, in the shape the Rust side actually sends.
              if (window.__harness.requirePassword &&
                  args.password !== window.__harness.requirePassword) {
                throw { needsPassword: true, message: "This document is password protected." };
              }
              return { name: "example.pdf", pageCount: window.__harness.pageCount ?? 3, encrypted: !!window.__harness.requirePassword };
            case "__unused_open_document":
              return { name: "example.pdf", pageCount: window.__harness.pageCount ?? 3, encrypted: false };
            case "render_page": {
              // Mirror the real renderer: a quarter turn swaps the axes.
              // A stub that ignores rotation would let a broken rotation
              // path pass its own test.
              const quarter = args.rotation === 90 || args.rotation === 270;
              const w = quarter ? 100 : 200, h = quarter ? 200 : 100;
              return fakePage(Math.round(w * args.zoom), Math.round(h * args.zoom));
            }
            case "page_size":
              // Always unrotated, as the real command returns.
              return { width: 200, height: 100 };
            case "extract_text":
              return "Hello EasyPDF";
            case "search":
              if (!args.query) return { hits: [], truncated: false };
              if (args.query === "nomatch") return { hits: [], truncated: false };
              // Page 0 hit near the BOTTOM of the page (bottom=10),
              // page 2 hit near the TOP (bottom=80). If the coordinate flip is
              // wrong these land on the wrong side and the test catches it.
              return {
                hits: [
                  { page: 0, rects: [{ left: 20, bottom: 10, right: 90, top: 30 }] },
                  { page: 2, rects: [{ left: 20, bottom: 80, right: 90, top: 95 }] },
                ],
                truncated: false,
              };
            case "close_document":
              return null;
            default:
              throw new Error(`unstubbed command: ${cmd}`);
          }
        },
      };
    </script>
  </head>
  <body>
    <header id="toolbar">
      <button id="open" type="button" class="primary">Open…</button>
      <div class="group" data-requires-document>
        <button id="prev" type="button">‹</button>
        <span id="page-indicator">— / —</span>
        <button id="next" type="button">›</button>
      </div>
      <div class="group" data-requires-document>
        <button id="zoom-out" type="button">−</button>
        <span id="zoom-indicator">100%</span>
        <button id="zoom-in" type="button">+</button>
        <button id="zoom-fit" type="button">Fit</button>
        <button id="zoom-fit-width" type="button">Width</button>
      </div>
      <div class="group" data-requires-document>
        <button id="rotate-left" type="button">↺</button>
        <button id="rotate-right" type="button">↻</button>
      </div>
      <div class="group" data-requires-document>
        <button id="view-page" type="button" class="active">Page</button>
        <button id="view-scroll" type="button">Scroll</button>
        <button id="toggle-outline" type="button">Outline</button>
      </div>
      <div class="group" data-requires-document>
        <input id="search-input" type="search" placeholder="Find in document" />
        <button id="search-prev" type="button">‹</button>
        <span id="search-count"></span>
        <button id="search-next" type="button">›</button>
      </div>
      <span id="doc-name"></span>
      <span id="sandbox-badge"></span>
    </header>
    <div id="workspace">
      <aside id="outline" hidden>
        <h2>Outline</h2>
        <ul id="outline-list"></ul>
        <p id="outline-empty" hidden>This document has no outline.</p>
      </aside>
      <main id="viewport">
      <div id="empty-state">
        <h1>EasyPDF</h1>
        <p>Open a PDF to get started.</p>
        <button id="open-empty" type="button" class="primary">Open a PDF…</button>
      </div>
        <div id="pages" hidden></div>
      </main>
    </div>
    <dialog id="password-dialog">
      <h2>Password required</h2>
      <p id="password-message">This document is password protected.</p>
      <input id="password-input" type="password" autocomplete="off"
             placeholder="Document password" />
      <div class="dialog-actions">
        <button id="password-cancel" type="button">Cancel</button>
        <button id="password-submit" type="button" class="primary">Open</button>
      </div>
    </dialog>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="../dist/main.js"></script>
  </body>
</html>
