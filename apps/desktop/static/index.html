<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyPDF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <button id="open" type="button" class="primary">Open…</button>

      <div class="group" data-requires-document>
        <button id="prev" type="button" title="Previous page">‹</button>
        <span id="page-indicator">— / —</span>
        <button id="next" type="button" title="Next page">›</button>
      </div>

      <div class="group" data-requires-document>
        <button id="zoom-out" type="button" title="Zoom out">−</button>
        <span id="zoom-indicator">100%</span>
        <button id="zoom-in" type="button" title="Zoom in">+</button>
        <button id="zoom-fit" type="button">Fit</button>
      </div>

      <div class="group" data-requires-document>
        <input id="search-input" type="search" placeholder="Find in document" />
        <button id="search-prev" type="button" title="Previous match">‹</button>
        <span id="search-count"></span>
        <button id="search-next" type="button" title="Next match">›</button>
      </div>

      <span id="doc-name"></span>
      <span id="sandbox-badge" title="Worker confinement status"></span>
    </header>

    <main id="viewport">
      <div id="empty-state">
        <h1>EasyPDF</h1>
        <p>Open a PDF to get started. Nothing leaves this machine.</p>
        <button id="open-empty" type="button" class="primary">Open a PDF…</button>
      </div>
      <div id="page-stack" hidden>
        <canvas id="page"></canvas>
        <canvas id="highlights"></canvas>
      </div>
    </main>

    <div id="error" role="alert" hidden></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
