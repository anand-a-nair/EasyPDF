name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Fetch pinned PDFium
        shell: bash
        run: bash scripts/fetch-pdfium.sh

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

      # The harness stubs Tauri so the frontend is testable without an app.
      # A stub that drifts from the real payload makes the harness pass while
      # the app is broken, so the two are checked against each other.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contract — harness stubs versus real payloads
        run: node scripts/check-contracts.mjs

      # Release-only: debug timings say nothing about the product.
      - name: Performance budgets
        run: cargo test --release -p easypdf-session --test budget -- --test-threads=1

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  version-sync:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifests match .version
        run: |
          bash scripts/sync-version.sh
          if ! git diff --quiet; then
            echo "::error::Manifests are out of sync with .version."
            echo "Run scripts/sync-version.sh and commit the result."
            git diff
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    # Tauri cannot be cross-compiled — each platform must build on its own OS.
    # See ideas/12-build-and-release.md. This matrix is a hard requirement, not
    # thoroughness for its own sake.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: msi
          - os: ubuntu-latest
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - name: Fetch pinned PDFium
        shell: bash
        run: bash scripts/fetch-pdfium.sh

      - run: cargo build --release --workspace

      # Bundling is what actually proves the app ships: the worker and the PDF
      # engine have to end up inside the package, and a build that links fine
      # can still produce an app that cannot open a document. See OQ-008.
      - name: Build the application bundle
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: apps/desktop

      - name: Check size budgets
        if: matrix.os != 'windows-latest'
        run: bash scripts/check-size.sh

      - name: Check size budgets (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash scripts/check-size.sh target/release/easypdf-desktop.exe

      - name: Verify the bundle is self-contained
        if: matrix.os == 'macos-latest'
        run: bash scripts/verify-bundle.sh

      # Startup and idle memory need a running app, so they cannot be covered
      # by the test suite. A CI runner is slower than a laptop, which is closer
      # to the baseline machine the budget is written against.
      - name: Startup and memory budgets
        if: matrix.os == 'macos-latest'
        run: python3 scripts/measure-startup.py
